<text x="28" y="99" font-size="10.5" letter-spacing="1.6" fill="#8c8c8c" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">O QUE É</text><circle cx="31" cy="120" r="2" fill="#8c8c8c"/><text x="42" y="124" font-size="12.5" fill="#d0d0d0">Gestão de escritórios de advocacia, multi-tenant</text><circle cx="31" cy="144" r="2" fill="#8c8c8c"/><text x="42" y="148" font-size="12.5" fill="#d0d0d0">Processos, clientes, agenda e honorários</text><circle cx="31" cy="168" r="2" fill="#8c8c8c"/><text x="42" y="172" font-size="12.5" fill="#d0d0d0">IA com Gemini: resumo, assistente e petições</text><circle cx="31" cy="192" r="2" fill="#8c8c8c"/><text x="42" y="196" font-size="12.5" fill="#d0d0d0">Portal público do cliente por magic link</text>
<line x1="415" y1="90" x2="415" y2="222" stroke="#242424"/>
<text x="433" y="99" font-size="10.5" letter-spacing="1.6" fill="#8c8c8c" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">COMO FOI FEITO</text><circle cx="436" cy="120" r="2" fill="#8c8c8c"/><text x="447" y="124" font-size="12.5" fill="#d0d0d0">API Gateway, Eureka e banco isolado por serviço</text><circle cx="436" cy="144" r="2" fill="#8c8c8c"/><text x="447" y="148" font-size="12.5" fill="#d0d0d0">Eventos no Kafka e filas RabbitMQ com dead-letter</text><circle cx="436" cy="168" r="2" fill="#8c8c8c"/><text x="447" y="172" font-size="12.5" fill="#d0d0d0">Circuit breaker, rate limiting e tracing com Zipkin</text><circle cx="436" cy="192" r="2" fill="#8c8c8c"/><text x="447" y="196" font-size="12.5" fill="#d0d0d0">Identidade assinada entre serviços, na Oracle Cloud</text>
