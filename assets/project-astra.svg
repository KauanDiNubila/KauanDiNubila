<svg xmlns="http://www.w3.org/2000/svg" width="830" height="292" viewBox="0 0 830 292" role="img" aria-label="Astra: Ecossistema de estudos · monólito modular" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
