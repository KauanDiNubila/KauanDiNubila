<text x="28" y="99" font-size="10.5" letter-spacing="1.6" fill="#8c8c8c" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">O QUE É</text><circle cx="31" cy="120" r="2" fill="#8c8c8c"/><text x="42" y="124" font-size="12.5" fill="#d0d0d0">Sessões de foco (Pomodoro ou manual) e metas</text><circle cx="31" cy="144" r="2" fill="#8c8c8c"/><text x="42" y="148" font-size="12.5" fill="#d0d0d0">Heatmap, streak, ranking social e roadmaps</text><circle cx="31" cy="168" r="2" fill="#8c8c8c"/><text x="42" y="172" font-size="12.5" fill="#d0d0d0">Chat em tempo real entre amigos</text><circle cx="31" cy="192" r="2" fill="#8c8c8c"/><text x="42" y="196" font-size="12.5" fill="#d0d0d0">Cruza a atividade do GitHub com o tempo estudado</text>
<line x1="415" y1="90" x2="415" y2="222" stroke="#242424"/>
<text x="433" y="99" font-size="10.5" letter-spacing="1.6" fill="#8c8c8c" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">COMO FOI FEITO</text><circle cx="436" cy="120" r="2" fill="#8c8c8c"/><text x="447" y="124" font-size="12.5" fill="#d0d0d0">Monólito modular por feature, PostgreSQL e Flyway</text><circle cx="436" cy="144" r="2" fill="#8c8c8c"/><text x="447" y="148" font-size="12.5" fill="#d0d0d0">Tudo derivado por agregação sobre a sessão</text><circle cx="436" cy="168" r="2" fill="#8c8c8c"/><text x="447" y="172" font-size="12.5" fill="#d0d0d0">JWT curto, refresh com rotação e login OAuth2</text><circle cx="436" cy="192" r="2" fill="#8c8c8c"/><text x="447" y="196" font-size="12.5" fill="#d0d0d0">CSP, auditoria OWASP ZAP e testes com Testcontainers</text>
