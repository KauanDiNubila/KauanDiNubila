<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Mão acenando">
<style>
text{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.hand{transform-box:fill-box;transform-origin:70% 85%;animation:wave 2.6s ease-in-out infinite}
@keyframes wave{
0%{transform:rotate(0)}
8%{transform:rotate(16deg)}
16%{transform:rotate(-10deg)}
24%{transform:rotate(16deg)}
32%{transform:rotate(-6deg)}
40%{transform:rotate(12deg)}
50%{transform:rotate(0)}
100%{transform:rotate(0)}
}
@media (prefers-reduced-motion:reduce){.hand{animation:none}}
</style>
<text class="hand" x="24" y="38" font-size="36" text-anchor="middle">👋</text>
</svg>
